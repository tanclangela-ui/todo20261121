<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <h1>To-Do Tracker</h1>
        <p class="subtitle" id="today"></p>
      </div>
      <div class="stats">
        <div class="stat"><span id="statActive">0</span>Active</div>
        <div class="stat"><span id="statOverdue">0</span>Overdue</div>
        <div class="stat"><span id="statDone">0</span>Done</div>
      </div>
    </header>

    <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

    <form id="taskForm" class="card form">
      <div class="form-main">
        <input id="item" placeholder="What needs to be done?" required autocomplete="off">
        <button type="button" id="cancelEdit" class="btn ghost" hidden>Cancel</button>
        <button type="submit" id="submitBtn" class="btn primary">Add task</button>
      </div>
      <div class="form-row">
        <label><span class="label-text">Priority</span>
          <select id="priority">
            <option value="High">High</option>
            <option value="Medium" selected>Medium</option>
            <option value="Low">Low</option>
          </select>
        </label>
        <label><span class="label-text">Deadline</span>
          <input id="deadline" type="date">
        </label>
        <label><span class="label-text">Requested by</span>
          <input id="requestedBy" placeholder="Name" autocomplete="off">
        </label>
      </div>
    </form>

    <div class="toolbar">
      <div class="chips" id="filters">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="active">Active</button>
        <button class="chip" data-filter="done">Done</button>
      </div>
      <div class="toolbar-right">
        <input id="search" type="search" placeholder="Search…">
        <select id="sort">
          <option value="created">Newest first</option>
          <option value="priority">Priority</option>
          <option value="deadline">Deadline</option>
          <option value="requestedBy">Requested by</option>
        </select>
      </div>
    </div>

    <ul id="taskList" class="task-list"></ul>
    <div id="empty" class="empty" hidden>
      <div class="empty-icon">✓</div>
      <p>Nothing here. Add a task above to get started.</p>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
