<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>To-Do Tracker Mockup</title>
  <!--
    Phone mockup of the To-Do Tracker at Galaxy S25 size.
    The S25 screen is 1080 × 2340 pixels, which phones show as a 360 × 780 web page.
    Each screen runs the real app (index.html?demo) with sample items; nothing is saved.
  -->
  <style>
    :root {
      --page: #eef0f7;
      --text: #1f2937;
      --muted: #6b7280;
    }
    @media (prefers-color-scheme: dark) {
      :root { --page: #0b1020; --text: #e2e8f0; --muted: #94a3b8; }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 20% 10%, rgba(99, 102, 241, 0.18), transparent 45%),
        radial-gradient(circle at 85% 90%, rgba(139, 92, 246, 0.18), transparent 45%),
        var(--page);
      padding: 40px 16px 48px;
    }
    h1 { margin: 0 0 6px; text-align: center; font-size: 1.8rem; }
    .sub { margin: 0 0 36px; text-align: center; color: var(--muted); }

    .phones {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 56px;
    }
    figure { margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px; }
    figcaption { font-weight: 600; color: var(--muted); }

    /* ---------- Phone body: flat sides, evenly thin bezels, rounded corners ---------- */
    .phone {
      position: relative;
      width: 384px;            /* 360px screen + 12px bezel each side */
      height: 804px;           /* 780px screen + 12px bezel top and bottom */
      padding: 12px;
      border-radius: 52px;
      background: linear-gradient(145deg, #3a3d46, #15161a 60%, #2a2c33);
      box-shadow:
        0 0 0 2px #50535c inset,          /* metal frame edge */
        0 30px 60px rgba(0, 0, 0, 0.35),
        0 10px 20px rgba(0, 0, 0, 0.2);
    }
    .phone.icy { background: linear-gradient(145deg, #d9dde6, #aeb4c0 60%, #c9ced8); box-shadow: 0 0 0 2px #e8ebf1 inset, 0 30px 60px rgba(0,0,0,0.25), 0 10px 20px rgba(0,0,0,0.15); }

    /* Side keys: volume rocker and power key, both on the right edge */
    .phone::before, .phone::after {
      content: "";
      position: absolute;
      right: -4px;
      width: 4px;
      border-radius: 0 3px 3px 0;
      background: inherit;
      filter: brightness(0.9);
    }
    .phone::before { top: 150px; height: 92px; }   /* volume */
    .phone::after  { top: 270px; height: 56px; }   /* power / side key */

    /* ---------- Screen ---------- */
    .screen {
      position: relative;
      width: 360px;
      height: 780px;
      border-radius: 40px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--app-bg);
      color: var(--app-text);
    }
    .screen.light { --app-bg: #f4f5fb; --app-text: #1f2937; }
    .screen.dark  { --app-bg: #0f172a; --app-text: #e2e8f0; }

    /* Android status bar with the centred punch-hole camera */
    .status {
      position: relative;
      flex: none;
      height: 34px;
      padding: 0 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
    }
    .camera {
      position: absolute;
      left: 50%;
      top: 9px;
      width: 14px;
      height: 14px;
      margin-left: -7px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #3b4252 0 20%, #05060a 45%);
      box-shadow: 0 0 0 2px #000;
    }
    .icons { display: flex; align-items: center; gap: 5px; }
    .icons svg { display: block; fill: currentColor; }

    /* Browser address bar (the app runs in the phone's web browser) */
    .urlbar {
      flex: none;
      margin: 2px 12px 6px;
      height: 36px;
      border-radius: 18px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 14px;
      font-size: 13px;
      background: rgba(127, 127, 127, 0.14);
      color: inherit;
      opacity: 0.85;
    }

    iframe {
      flex: 1;
      width: 100%;
      border: 0;
      display: block;
      background: var(--app-bg);
    }

    /* Android gesture bar */
    .navbar { flex: none; height: 22px; display: flex; align-items: center; justify-content: center; }
    .navbar span { width: 110px; height: 4px; border-radius: 2px; background: currentColor; opacity: 0.55; }

    .note { max-width: 640px; margin: 40px auto 0; text-align: center; font-size: 0.85rem; color: var(--muted); }

    /* Small screens: shrink the phones so they fit */
    @media (max-width: 420px) {
      .phone { transform: scale(0.82); transform-origin: top center; margin-bottom: -145px; }
    }
  </style>
</head>
<body>
  <h1>To-Do Tracker</h1>
  <p class="sub">Mockup at Galaxy S25 screen size (6.2″, 360 × 780)</p>

  <div class="phones">
    <figure>
      <div class="phone icy">
        <div class="screen light">
          <div class="status">
            <span>9:41</span>
            <i class="camera"></i>
            <span class="icons" aria-hidden="true">
              <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.3" y="5.5" width="3" height="6.5" rx="1"/><rect x="8.6" y="3" width="3" height="9" rx="1"/><rect x="12.9" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 12 0 3.2A11.5 11.5 0 0 1 15 3.2Z"/></svg>
              <svg width="22" height="12" viewBox="0 0 22 12"><rect x="0.5" y="0.5" width="18" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2.5" y="2.5" width="11" height="7" rx="1.5"/><rect x="19.5" y="4" width="2" height="4" rx="1"/></svg>
            </span>
          </div>
          <div class="urlbar"><span aria-hidden="true">🔒</span> my-todo-tracker</div>
          <iframe src="index.html?demo&amp;theme=light" title="To-Do Tracker, light mode"></iframe>
          <div class="navbar"><span></span></div>
        </div>
      </div>
      <figcaption>Light mode</figcaption>
    </figure>

    <figure>
      <div class="phone">
        <div class="screen dark">
          <div class="status">
            <span>9:41</span>
            <i class="camera"></i>
            <span class="icons" aria-hidden="true">
              <svg width="16" height="12" viewBox="0 0 16 12"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="4.3" y="5.5" width="3" height="6.5" rx="1"/><rect x="8.6" y="3" width="3" height="9" rx="1"/><rect x="12.9" y="0" width="3" height="12" rx="1"/></svg>
              <svg width="15" height="12" viewBox="0 0 15 12"><path d="M7.5 12 0 3.2A11.5 11.5 0 0 1 15 3.2Z"/></svg>
              <svg width="22" height="12" viewBox="0 0 22 12"><rect x="0.5" y="0.5" width="18" height="11" rx="3" fill="none" stroke="currentColor"/><rect x="2.5" y="2.5" width="11" height="7" rx="1.5"/><rect x="19.5" y="4" width="2" height="4" rx="1"/></svg>
            </span>
          </div>
          <div class="urlbar"><span aria-hidden="true">🔒</span> my-todo-tracker</div>
          <iframe src="index.html?demo&amp;theme=dark&amp;view=list" title="To-Do Tracker, dark mode"></iframe>
          <div class="navbar"><span></span></div>
        </div>
      </div>
      <figcaption>Dark mode</figcaption>
    </figure>
  </div>

  <p class="note">
    Each screen is the real app running with sample items, so you can scroll and tap around.
    Nothing you do here is saved, and it doesn't touch your real list.
  </p>
</body>
</html>
